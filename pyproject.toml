# pacrunner: pyAmpliCol's recurrence programs as UMAMI libraries, installed from a clone of this
# repository with `python -m pip install -e .` (or not editable: the C sources, pacrunner/c/, are package
# data). symjit >= 2.29 is a requirement: pip keeps a conda-forge symjit that satisfies it, and
# otherwise installs a PyPI wheel (correct for every Python >= 3.10 from 2.29.1). MadSpace and
# pyAmpliCol come from a MadGraph7 checkout (pacrunner.configure).
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pacrunner"
version = "0.3.0"
description = "pyAmpliCol's LC recurrence programs as UMAMI libraries for MadGraph7/MadSpace (CPU, CUDA), from Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "symjit>=2.29"]

[project.optional-dependencies]
cuda = ["cupy-cuda13x"]

[tool.setuptools]
# only the Python package and its C sources: the repository root also holds the tests
# (pacrunner.c: the C sources as data, a package for setuptools only)
packages = ["pacrunner", "pacrunner.uir", "pacrunner.kernels", "pacrunner.codegen", "pacrunner.c"]

[tool.setuptools.package-data]
"pacrunner.c" = ["*"]
