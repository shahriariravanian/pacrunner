# pacrunner: pyAmpliCol's recurrence programs as UMAMI libraries. Installed from PyPI (`pip install pacrunner`,
# `pacrunner[cuda]` for the CUDA runtimes) or from a clone (`python -m pip install -e .`). The wheel is pure Python:
# the C sources (pacrunner/c/) and the SIMD fragments (pacrunner/simd/lib*/) are package data, compiled on the
# user's machine. symjit >= 2.29.3: pip keeps a conda-forge symjit that satisfies it, else installs the PyPI wheel.
# MadSpace and pyAmpliCol come from a MadGraph7 checkout (pacrunner.configure).
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pacrunner"
version = "0.5.1"
description = "pyAmpliCol's LC recurrence programs as UMAMI libraries for MadGraph7/MadSpace (CPU, CUDA), from Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "symjit>=2.29.3"]
license = "MIT"
# pacrunner/c/UMAMI_LICENSE: MadGraph7's terms for the UMAMI headers shipped in pacrunner/c/
license-files = ["LICENSE", "pacrunner/c/UMAMI_LICENSE"]
authors = [{ name = "Shahriar Iravanian" }]
keywords = ["MadGraph7", "MadSpace", "pyAmpliCol", "UMAMI", "matrix elements", "CUDA", "SIMD", "particle physics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/shahriariravanian/pacrunner"
Source = "https://github.com/shahriariravanian/pacrunner"
Issues = "https://github.com/shahriariravanian/pacrunner/issues"

[project.optional-dependencies]
cuda = ["cupy-cuda13x"]

[tool.setuptools]
# only the Python package and its C sources: the repository root also holds the tests
# (pacrunner.c*: the C sources as data, packages for setuptools only: common, CUDA, Metal)
packages = ["pacrunner", "pacrunner.uir", "pacrunner.kernels", "pacrunner.codegen", "pacrunner.simd", "pacrunner.simd.lib",
            "pacrunner.simd.lib_hand_avx2", "pacrunner.simd.lib_hand_avx512", "pacrunner.simd.lib_hand_neon",
            "pacrunner.c", "pacrunner.c.cuda", "pacrunner.c.metal"]

[tool.setuptools.package-data]
"pacrunner.simd.lib" = ["*.json"]
"pacrunner.simd.lib_hand_avx2" = ["*.json"]
"pacrunner.simd.lib_hand_avx512" = ["*.json"]
"pacrunner.simd.lib_hand_neon" = ["*.json"]
"pacrunner.c" = ["*"]
"pacrunner.c.cuda" = ["*"]
"pacrunner.c.metal" = ["*"]

[tool.setuptools.exclude-package-data]
# UMAMI_LICENSE ships once, as a license file (license-files: the wheel's .dist-info/licenses/)
"pacrunner.c" = ["UMAMI_LICENSE"]
