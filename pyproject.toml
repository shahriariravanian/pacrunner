# pacrunner: pyAmpliCol's recurrence programs as UMAMI libraries, installed from a clone of this
# repository with `python -m pip install -e .` (editable only: the package finds its C sources, c/,
# beside it). symjit >= 2.29 comes from conda-forge (binary dependencies), not from PyPI; MadSpace and
# pyAmpliCol come from a MadGraph7 checkout (pacrunner.configure).
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pacrunner"
version = "0.3.0"
description = "pyAmpliCol's LC recurrence programs as UMAMI libraries for MadGraph7/MadSpace (CPU, CUDA), from Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]   # and symjit >= 2.29, from conda-forge (binary dependencies): not a pip requirement

[project.optional-dependencies]
cuda = ["cupy-cuda13x"]

[tool.setuptools]
# only the Python package: the repository root also holds the C (c/), tests, and until 0.4 the Julia sources (src/)
packages = ["pacrunner", "pacrunner.uir", "pacrunner.kernels", "pacrunner.codegen"]
